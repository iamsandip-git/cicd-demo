version: "3.9" # Specify the docker-compose version

services:
  app:
    build:
      context: ./
    image: sandip1991/cicd-test
    ports:
      - "3000:3000" # Map port 3000 on the host to port 3000 in the container
    volumes:
      - .:/app # Mount the current directory to the /app directory in the container
      - /app/node_modules # Prevent overwriting node_modules in the container
    environment:
      - NODE_ENV=development # Set environment variables
